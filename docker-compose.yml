# ARTCB — Stack complète Docker
# Usage : docker compose up -d
# API disponible sur http://localhost:8000/api/v1/health

services:

  artcb-api:
    build: .
    image: artcb/node:latest
    container_name: artcb-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - artcb-data:/app/data
      - artcb-logs:/app/logs
      - artcb-rapports:/app/rapports
    environment:
      - PYTHONPATH=/app
      - ARTCB_DEBUG=${ARTCB_DEBUG:-false}
      - ARTCB_ENCODE_MODE=${ARTCB_ENCODE_MODE:-rule-based}
      - ARTCB_LLM_ENABLED=${ARTCB_LLM_ENABLED:-false}
      - ARTCB_ANTI_SYBIL_AI_BYPASS=${ARTCB_ANTI_SYBIL_AI_BYPASS:-false}
      - ARTCB_MIN_BLOCK_INTERVAL_SEC=${ARTCB_MIN_BLOCK_INTERVAL_SEC:-60}
      # ARTCB_WALLET_PASSPHRASE OBLIGATOIRE — aucun défaut fourni (rapport 119).
      # Définir dans le .env local : ARTCB_WALLET_PASSPHRASE=VotrePassphraseForte
      # Sans cette variable le conteneur refuse de démarrer (voir node_identity.py pattern).
      - ARTCB_WALLET_PASSPHRASE=${ARTCB_WALLET_PASSPHRASE:?ARTCB_WALLET_PASSPHRASE est obligatoire. Définissez-la dans votre .env avant de lancer docker compose up.}
      - BOB_API_KEY=${BOB_API_KEY:-}
      - GRADIUM_API_KEY=${GRADIUM_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  artcb-node2:
    build: .
    image: artcb/node:latest
    container_name: artcb-node2
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - artcb-data-node2:/app/data
      - artcb-logs-node2:/app/logs
    environment:
      - PYTHONPATH=/app
      - ARTCB_DEBUG=${ARTCB_DEBUG:-false}
      - ARTCB_ENCODE_MODE=rule-based
      - ARTCB_LLM_ENABLED=false
      - ARTCB_ANTI_SYBIL_AI_BYPASS=false
    depends_on:
      artcb-api:
        condition: service_healthy
    profiles:
      - multinode

volumes:
  artcb-data:
  artcb-logs:
  artcb-rapports:
  artcb-data-node2:
  artcb-logs-node2:
